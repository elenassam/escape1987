<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1987 외신 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: dark case-file chrome (top bar + stepper) around light newsprint activity sheets. */
:root{
  --ink:#0f1514; --panel:#172120; --fg:#ece6d6; --muted:#9fb0aa; --brass:#c9a86a; --stamp:#b5402f; --good:#5f9e6a; --bad:#c0563f;
  --paper:#f3eee1; --paper2:#e9e1cc; --news:#1b1b1b; --rule:#2a2a2a;
  --pink:#ffb3d1; --yellow:#ffe66d; --blue:#a6dcff;
  --f-head:'Playfair Display','Noto Serif KR',serif; --f-news:'Old Standard TT','Noto Serif KR',Georgia,serif; --f-kr:'Noto Sans KR','Malgun Gothic',sans-serif; --f-krs:'Noto Serif KR',serif; --f-type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--fg);font:15px/1.65 var(--f-kr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:#0b100fee;backdrop-filter:blur(6px);border-bottom:1px solid #c9a86a33;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top .row{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:900 18px var(--f-krs);letter-spacing:-.01em}.brand em{font-style:normal;color:var(--brass)}
.me{margin-left:auto;font-size:13px;color:var(--muted)}.me b{color:var(--fg)}
.steps{max-width:1080px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto}
.steps a{flex:1 0 auto;text-decoration:none;color:var(--muted);border:1px solid #ffffff1c;border-radius:4px;padding:6px 12px;font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.steps a b{font:700 12px var(--f-kr);color:var(--brass)}
.steps a.on{background:#c9a86a22;border-color:var(--brass);color:var(--fg)}
.steps a .ok{color:var(--good);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
h1.pg{font:900 clamp(24px,4vw,34px)/1.25 var(--f-krs);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid #c9a86a2e;border-radius:6px;padding:18px 20px}
.how{background:#1d2a28;border-left:4px solid var(--brass);border-radius:4px;padding:14px 18px;margin:0 0 18px}
.how h3{margin:0 0 6px;font:700 15px var(--f-kr);color:var(--brass)}
.how ol,.how ul{margin:0;padding-left:20px}.how li{margin:2px 0}
.btn{background:#22302e;border:1px solid #ffffff2a;border-radius:4px;padding:10px 18px}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1a1408;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.msg{font-size:14px;color:var(--muted)}.msg.err{color:#f0a493}
/* entry */
.entry{max-width:560px;margin:5vh auto 0}
.entry .eyebrow{font:700 12px var(--f-kr);letter-spacing:.2em;color:var(--brass)}
.entry h1{font:900 clamp(30px,6vw,46px)/1.15 var(--f-krs);margin:8px 0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.namerow{margin-top:10px}.namerow input{width:100%}
.demo-chip{background:#7a2a1f;color:#ffd9cf;border-radius:4px;padding:3px 8px;font:700 12px var(--f-kr)}.demo-btn{background:#e2553f;color:#fff;border:0;border-radius:4px;padding:5px 12px;font:700 13px var(--f-kr);cursor:pointer}
.grid3 label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.grid3 input{background:#0b100f;border:1px solid var(--brass);border-radius:4px;padding:12px;font-size:18px;text-align:center}
.credit{font-size:12px;color:#7e8d88;margin-top:24px}
/* newspaper */
.paper{background:var(--paper);color:var(--news);border-radius:3px;box-shadow:0 18px 50px #000a;padding:22px clamp(16px,4vw,40px) 28px;position:relative;background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:3px 3px}
.mast{text-align:center;border-bottom:3px double var(--rule);padding-bottom:8px}
.mast .nm{font:900 clamp(28px,5.5vw,52px)/1 var(--f-head);letter-spacing:.01em}
.mast .tag{font:italic 13px var(--f-news);margin-top:4px}
.strip{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:12px var(--f-news);border-bottom:1px solid var(--rule);padding:5px 0;text-transform:uppercase;letter-spacing:.06em}
.fic{position:absolute;top:12px;right:14px;font:700 11px var(--f-kr);color:var(--stamp);border:1.5px solid var(--stamp);padding:2px 7px;transform:rotate(3deg);background:#f3eee1}
.head{font:900 clamp(26px,4.6vw,44px)/1.1 var(--f-head);margin:18px 0 8px;text-align:center;text-wrap:balance}
.deck{text-align:center;font:italic 16px var(--f-news);margin:0 0 14px;color:#333}
.byline{font:12px var(--f-news);text-transform:uppercase;letter-spacing:.1em;border-top:1px solid #0003;border-bottom:1px solid #0003;padding:5px 0;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cols{columns:2 300px;column-gap:32px;column-rule:1px solid #0002;font:17px/1.75 var(--f-news);text-align:justify;hyphens:auto}
.cols p{margin:0 0 12px;break-inside:avoid-column}
.cols p:first-child::first-letter{float:left;font:900 54px/.85 var(--f-head);padding:4px 6px 0 0}
.dl{font-weight:700}
.s{border-radius:3px;padding:1px 1px;transition:background .15s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pickable .s{cursor:pointer}
.pickable .s:hover{outline:1px dashed #0006}
.s.pink{background:linear-gradient(transparent 12%,var(--pink) 12%,var(--pink) 92%,transparent 92%)}
.s.yellow{background:linear-gradient(transparent 12%,var(--yellow) 12%,var(--yellow) 92%,transparent 92%)}
.s.blue{background:linear-gradient(transparent 12%,var(--blue) 12%,var(--blue) 92%,transparent 92%)}
.s.flash{outline:3px solid var(--stamp);outline-offset:2px}
.s.r-ok{box-shadow:inset 0 -2px 0 var(--good)}
.s.r-miss{outline:2px dashed #b07a00;outline-offset:1px}
.s.r-bad{text-decoration:underline wavy var(--bad) 2px;text-underline-offset:4px}
.sid{font:700 10px var(--f-kr);vertical-align:super;color:#8a7a5a;margin-left:1px;user-select:none}
/* pens */
.pens{position:sticky;top:96px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;background:var(--ink);padding:8px 0}
.pen{flex:1 1 200px;display:flex;gap:10px;align-items:flex-start;text-align:left;background:#1c2725;border:2px solid transparent;border-radius:6px;padding:10px 12px}
.pen i{flex:none;width:26px;height:26px;border-radius:50%;margin-top:2px;box-shadow:inset 0 0 0 2px #0003}
.pen b{display:block;font-size:14px}.pen small{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.pen[aria-pressed=true]{border-color:var(--brass);background:#26332f}
.pen.eraser{flex:0 0 auto;align-items:center}
.res{margin-top:18px}
.res .row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #ffffff14}
.res .row i{width:18px;height:18px;border-radius:50%;margin-top:4px}
.score{font:900 34px var(--f-krs);color:var(--brass)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
/* tf */
.tf{display:grid;gap:10px}
.tfq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid #ffffff14;border-radius:6px;padding:12px 14px}
.tfq .n{font:700 14px var(--f-kr);color:var(--brass)}
.tfq .en{font:17px var(--f-news)}
.tfq .seg{display:flex;gap:6px}
.tfq .seg button{width:48px;height:40px;border-radius:4px;background:#0f1514;border:1px solid #ffffff2a;font:700 16px var(--f-kr)}
.tfq .seg button[aria-pressed=true]{background:var(--brass);color:#1a1408;border-color:var(--brass)}
.tfq.ok{border-color:var(--good)}.tfq.no{border-color:var(--bad)}
.tfq .why{grid-column:2/4;font-size:13.5px;color:var(--muted)}
.tfq .why button{background:none;border:0;color:var(--brass);text-decoration:underline;padding:0 4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}.pens{top:110px}}
.sticky{position:sticky;top:112px}
/* act3 */
.fix{background:var(--panel);border:1px solid #ffffff14;border-radius:8px;padding:16px;margin-bottom:14px}
.fix.ok{border-color:var(--good)}.fix.no{border-color:var(--bad)}
.claim{background:var(--paper);color:var(--news);font:18px var(--f-news);padding:10px 14px;border-left:5px solid var(--pink);border-radius:3px}
.claim small{display:block;font:700 11px var(--f-kr);color:#8a3a5a;letter-spacing:.06em}
.stepl{font:700 13px var(--f-kr);color:var(--brass);margin:14px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cardp{text-align:left;background:#ece3cc;color:#2a2620;border:2px solid transparent;border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.45}
.cardp b{display:block;font:700 13px var(--f-krs)}
.cardp small{font:700 10px var(--f-kr);color:#7a6e58}
.cardp[aria-pressed=true]{border-color:var(--stamp);box-shadow:0 0 0 3px #b5402f44}
.sent{font:19px var(--f-news);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sent input{width:150px;background:#0b100f;border:0;border-bottom:2px solid var(--brass);padding:4px 6px;font:19px var(--f-news);text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bank.mini{margin-top:10px}.bank.mini::before{content:'단어 고르기';font:12px var(--f-kr);color:var(--muted);align-self:center;margin-right:2px}
.bank button[aria-pressed=true]{background:#7fa39c;color:#0b100f}
details.reread{margin:0 0 14px}details.reread>summary{cursor:pointer;display:inline-block;padding:7px 14px;border:1px solid var(--brass);color:var(--brass);border-radius:4px;font-weight:700;list-style:none}details.reread>summary::-webkit-details-marker{display:none}details.reread[open]>summary{margin-bottom:12px}
.wbtn{background:var(--brass);color:#1a1408;border:0;border-radius:4px;padding:5px 14px;font:700 14px var(--f-kr);cursor:pointer}.wbtn[aria-expanded=true]{outline:2px solid #fff6}
.wpanel[hidden]{display:none}
.wpanel{position:fixed;right:max(16px,calc((100vw - 1080px) / 2));top:96px;z-index:41;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 116px);display:flex;flex-direction:column;background:#14201e;border:1px solid #ffffff22;border-radius:8px;box-shadow:0 20px 50px #000a}
.wpanel .wh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid #ffffff14}.wpanel .wh b{flex:1}
.wpanel input{width:100%;margin:10px 14px 4px;width:calc(100% - 28px);background:#0b100f;border:1px solid #ffffff22;color:inherit;border-radius:4px;padding:8px 10px;font:15px var(--f-kr)}
.wpanel .wl{overflow:auto;padding:4px 14px 14px}.wpanel h4{margin:12px 0 4px;font:700 12px var(--f-kr);color:var(--brass);letter-spacing:.05em}
.wpanel .w{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #ffffff0d;font-size:15px}.wpanel .w span:first-child{font-family:var(--f-news);color:#f1e7cf}.wpanel .w span:last-child{color:var(--muted);text-align:right}
.bank button{background:#0b100f;border:1px solid #7fa39c88;color:#bfe0d9;border-radius:20px;padding:3px 12px;font:15px var(--f-news)}
.why{font-size:13.5px;color:var(--muted);margin-top:8px}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;gap:8px;align-items:center;background:#1c2725;border:1px solid #ffffff1c;border-radius:20px;padding:6px 14px;cursor:pointer}
.chk input{accent-color:var(--brass);width:18px;height:18px}
/* act4 */
.dossier{background:#e8dcc0;color:#2b2112;border-radius:3px;padding:20px clamp(14px,3vw,30px);box-shadow:0 18px 50px #000a;position:relative;background-image:repeating-linear-gradient(0deg,#0000 0 31px,#7a5a2a12 31px 32px)}
.dossier h2{font:400 26px var(--f-type);margin:0 0 4px;letter-spacing:.04em}
.dossier .ts{position:absolute;top:16px;right:18px;font:700 16px var(--f-type);color:var(--stamp);border:3px solid var(--stamp);padding:4px 10px;transform:rotate(6deg);opacity:.85}
.tipt{width:100%;border-collapse:collapse;margin-top:12px}
.tipt th,.tipt td{border:1px solid #2b211233;padding:10px;vertical-align:top;text-align:left}
.tipt th{width:130px;font:400 15px var(--f-type);background:#2b21120d}
.tipt td.tipc{width:30%;font-size:12.5px;color:#6b5a3a}
.tline{font:17px var(--f-type);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;line-height:2}
.tline input,.codename{background:#fff8;border:0;border-bottom:2px solid #2b2112;padding:2px 6px;font:17px var(--f-type);min-width:120px;flex:1 1 140px;color:#1d2f5c}
.fld{position:relative}
.tipt .q{font:700 14px var(--f-kr);color:#2b2112}.tipt .need{font:12.5px var(--f-kr);color:#7a5a20;margin:2px 0 6px}
textarea.tw{width:100%;min-height:62px;background:#fffbf0;border:1px solid #2b211233;border-bottom:2px solid #2b2112;border-radius:2px;padding:8px 10px;font:17px/1.6 var(--f-type);color:#1d2f5c;resize:vertical}
.starters{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.starters::before{content:'쓸 수 있는 표현';font:12px var(--f-kr);color:#6b5a3a;align-self:center;margin-right:2px}.starters button{background:#2b21120d;border:1px solid #2b211233;color:#3b2c14;border-radius:14px;padding:1px 10px;font:14px var(--f-type)}
.who{position:absolute;top:-16px;right:0;font:700 10px var(--f-kr);background:#1d6b5c;color:#fff;border-radius:8px;padding:0 6px;white-space:nowrap}
@media (max-width:720px){.tipt th{width:auto;display:block}.tipt td{display:block}.tipt tr{display:block;border-bottom:2px solid #2b211233}}
.status{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--f-kr);padding:4px 12px;border-radius:20px;background:#ffffff14}
.status.review{background:#c9a86a33;color:var(--brass)}.status.feedback{background:#5f9e6a33;color:#9fd6a8}.status.final{background:#b5402f33;color:#f0a493}
.fb{background:#fff7e0;color:#3a2a10;border-left:5px solid var(--brass);padding:14px 16px;border-radius:4px;margin:16px 0}
.fb b{display:block;font-size:13px;color:#8a6a2e;margin-bottom:4px}
textarea.final{width:100%;min-height:200px;background:#fffdf6;color:#1d2f5c;border:1px solid #2b211244;border-radius:3px;padding:14px;font:18px/1.7 var(--f-type)}
.wc{font:700 14px var(--f-kr)}.wc.over{color:var(--bad)}
.ov{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
.ov video{max-width:min(1100px,100%);max-height:78vh;border-radius:4px}
.ov .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}
.vcap{font:15px var(--f-type);color:#7dffa8;letter-spacing:.04em;text-shadow:0 0 8px #3f9}
.scramble{font:18px/1.6 var(--f-type);color:#7dffa8;max-width:760px;word-break:break-all;text-shadow:0 0 8px #3f9}
.telex{background:#efe6cf;color:#1b1b1b;font:19px/1.7 var(--f-type);padding:24px 26px;border-radius:3px;max-width:680px;width:100%;box-shadow:0 20px 60px #000c;position:relative;white-space:pre-wrap}
.telex .hd{font:700 12px var(--f-kr);letter-spacing:.14em;color:#7a3a2a;margin-bottom:10px;white-space:normal}
.telex .ko{font:14px/1.7 var(--f-kr);color:#5a4a30;margin-top:14px;white-space:normal;border-top:1px dashed #0003;padding-top:10px}
.cursor::after{content:'▌';animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.result img{max-width:100%;border-radius:4px;box-shadow:0 18px 40px #000a;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="row"><div class="brand">1987 · <em>외신 미션</em></div><div class="me" id="me"></div><button class="wbtn" id="wbtn" type="button" aria-expanded="false" aria-controls="wp">단어장</button></div>
  <nav class="steps" id="steps" aria-label="활동"></nav>
</header>
<main id="view"></main>
<div id="ovRoot"></div>
<aside class="wpanel" id="wp" hidden aria-label="단어장"><div class="wh"><b>단어장</b><button class="btn" id="wx" style="padding:4px 10px">닫기</button></div><input id="wq" placeholder="영어나 한국어로 찾기" aria-label="단어 찾기"><div class="wl" id="wl"></div></aside>
<script src="common.js"></script>
<script>
(() => {
const D = window.M87, $ = s => document.querySelector(s), el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const m = String(v || '').match(/\d+/); return m ? String(parseInt(m[0], 10)) : '' };
const LS = k => 'm87_' + k;
const get = (k, d) => { try { const v = localStorage.getItem(LS(k)); return v ? JSON.parse(v) : d } catch (e) { return d } };
const put = (k, v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)) } catch (e) { } };
let me = get('me', null);
const meKey = () => me.cls + '_' + me.no;
/* ---------- 교사 시연 모드: 0반 0번 0조 수소티 ---------- */
const isDemo = () => !!me && me.cls === '0' && me.no === '0' && me.team === '0' && me.name === '수소티';
let demoFill = null;
// 시연 기록도 실제 서버(0반)에 저장 → 교사 화면에서 확인·피드백 시연 가능. 시연 로그인 때마다 0반 기록을 새로 비움
function demoReset() { Object.keys(localStorage).filter(k => k.startsWith('m87_') && /_0_0$/.test(k)).forEach(k => { try { localStorage.removeItem(k) } catch (e) { } }); ['a1_0_0', 'a2_0_0', 'a3_0_0', 'a4done_0_0'].forEach(k => put(k, null)); return fetch('/api/m/demoreset', { method: 'POST' }).catch(() => { }) }
async function api(path, body) { const r = await fetch('/api/m/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json() }
function saveAct(act, data) { put(act + '_' + meKey(), data); api('student', { ...me, act: 'act' + act.slice(1), data }).catch(() => { }) }
const STEPS = [['a1', '1', '형광펜으로 읽기'], ['a2', '2', 'T/F 확인'], ['a3', '3', '증거로 바로잡기'], ['a4', '4', '비밀 제보서 (조별)']];
function alertMsg() { const m = document.querySelector('.msg'); if (m) m.textContent = '이 화면에는 채울 답이 없어요.' }
function nav(cur) {
