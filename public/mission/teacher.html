<style>
/* Layout: control-room dashboard — summary tiles, class tabs, student table, team dossier cards with feedback boxes. */
:root{--ink:#0d1312;--panel:#151e1d;--fg:#ece6d6;--muted:#9fb0aa;--brass:#c9a86a;--good:#7fc08a;--warn:#e0b04a;--bad:#e38672;--line:#c9a86a2e;--f:'Noto Sans KR','Malgun Gothic',sans-serif;--fs:'Noto Serif KR',serif;--fm:'IBM Plex Mono',monospace;--ft:'Special Elite','Courier New',monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.6 var(--f)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.head h1{font:900 26px var(--fs);margin:0}.eyebrow{font:600 11px var(--fm);letter-spacing:.2em;color:var(--brass)}
.btn{background:#1f2b29;border:1px solid #ffffff2a;border-radius:4px;padding:8px 14px}.btn:hover{border-color:var(--brass)}

.tabs button[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:700}
.tabs b{font:600 11px var(--fm);margin-left:6px;color:var(--brass)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}

.bar{display:inline-block;width:60px;height:6px;background:#2a3533;border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}

.g{background:#e8dcc0;color:#2b2112;border-radius:4px;padding:14px 16px;position:relative;border:3px solid transparent}

.g h3{margin:0;font:400 20px var(--ft)}.g .meta{font-size:12px;color:#6b5a3a;margin:2px 0 8px}
.g .st{position:absolute;top:12px;right:12px;font:700 12px var(--f);padding:3px 10px;border-radius:20px;background:#2b211214}
.g .st.review{background:#e0b04a;color:#2b2112}.g .st.feedback{background:#2f7a5a;color:#fff}.g .st.final{background:#a3261c;color:#fff}
.g dl{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:0;font-size:13px}.g dt{color:#6b5a3a;font:12px var(--ft)}.g dd{margin:0;font:15px var(--ft);color:#1d2f5c;word-break:break-word}.g dd.e{color:#a08a60}
.g textarea{width:100%;min-height:150px;margin-top:10px;background:#fffdf6;border:1px solid #2b211244;border-radius:3px;padding:8px 10px;color:#2b2112;font:14px/1.6 var(--f)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.fbk{margin-top:8px}.fbk>summary{cursor:pointer;font:700 12px var(--f);color:#6b5a3a;padding:4px 0}.fbrow .chips button{text-align:left}.fbrow{display:flex;gap:8px;align-items:flex-start;margin-top:5px}.fbl{flex:0 0 74px;font:700 11px var(--f);color:#6b5a3a;padding-top:5px}.fbrow .chips{margin-top:0}.fbrow.pos .chips button{border-color:#2f7a5a66;color:#225c43;background:#2f7a5a12}.fbrow.neg .chips button{border-color:#a3261c55;color:#8a2219;background:#a3261c0d}.chips button{background:#2b21120f;border:1px solid #2b211233;color:#2b2112;border-radius:14px;padding:2px 9px;font-size:12px}
.g .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.g .btn{background:#2b2112;color:#efe6cf;border-color:#2b2112}.g .btn.auto{background:#f3e7c4;color:#2b2112;border-color:#c9a86a}.g .sent{font-size:12px;color:#2f7a5a}
.g .final{background:#fffdf6;border:1px dashed #2b211255;padding:10px;margin-top:10px;font:15px/1.6 var(--ft);color:#1d2f5c}
.gate{max-width:380px;margin:12vh auto;text-align:center}.gate input{width:100%;padding:12px;font:600 22px var(--fm);text-align:center;background:#0b100f;border:1px solid var(--brass);border-radius:4px;margin:14px 0}
.err{color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.confirm{background:#2a1915;border:1px solid var(--bad);border-radius:4px;padding:10px 14px;margin-top:10px}
</style>

<body>
<div class="gate" id="gate"><div class="eyebrow">TEACHER</div><h1 style="font:900 24px var(--fs)">외신 미션 교사용</h1><p class="note">교사 비밀번호를 입력하세요.</p><form id="gf"><input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="비밀번호"><button class="btn primary" style="width:100%">들어가기</button></form><p class="err" id="ge"></p></div>
<div class="wrap" id="app" hidden>
  <div class="head"><div><div class="eyebrow">TEACHER · 2차시 외신 미션</div><h1>실시간 제출 현황</h1></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="live" id="live">연결 중…</span><a class="btn" href="./" target="_blank" style="text-decoration:none">학생 화면 열기</a><button class="btn" id="clr">이 반 기록 지우기</button></div></div>
  <div id="cf"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tiles" id="tiles"></div>
  <h2>조별 비밀 제보서 <small>노란 테두리 = 검토 요청이 와서 피드백을 기다리는 조</small></h2>
  <div class="groups" id="groups"></div>
  <h2>개인 활동 1~3 <small>제출하면 자동 채점돼요 · 열 제목을 누르면 정렬</small></h2>
  <div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note" style="margin-top:16px">made by. 나수진쌤 &amp; 전소현쌤</p>
</div>
<script src="common.js"></script>
<script>
(() => {
const D = window.M87, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* 피드백 틀: 1. 구성 / 2. 언어 사용, 잘한 점 + / 고칠 점 - */
const FB_HEAD = ['', '1. 구성', '2. 언어 사용'];
const FB_TPL = '1. 구성\n+ \n- \n2. 언어 사용\n+ \n- ';
const FB_SETS = [
  [1, '+', '구성 +', [
    '① 날짜(January 14, 1987)·장소(a police office in Seoul)·사건을 한 문장에 정확히 담았어요.',
    '② 경찰의 주장(died of shock)과 그 뒤에 한 일(closed the case)을 모두 썼어요.',
    '③ However로 시작해 경찰의 주장과 진실(asphyxia)을 분명하게 나눴어요.',
    '④ 몸에 남은 흔적(bruises on his neck and chest)과 의사의 관찰(water in the lungs)처럼 증거를 2개 이상 들었어요.',
    '⑤ because로 알려야 하는 이유를 밝히고, Please로 기자에게 할 일을 분명히 부탁했어요.',
    '사건 → 주장 → 진실 → 증거 → 부탁 순서로 이어져서 처음 읽는 기자도 이해하기 쉬워요.']],
  [1, '-', '구성 −', [
    '① 날짜가 빠졌어요. 기사 1문단 첫 문장에서 학생이 숨진 날짜를 찾아 On January 14, 1987, 처럼 쓰세요. (1월 16일은 기사가 나온 날이에요)',
    '① 장소가 빠졌어요. 어디에서 숨졌는지 at a police office in Seoul 을 넣으세요.',
    '② 경찰이 무엇이라고 주장했는지 The police claimed (that) he died of shock. 처럼 쓰세요.',
    '② 경찰이 그 뒤에 한 일도 쓰세요. 예) They closed the case a few days later.',
    '③ But이나 However로 시작해야 경찰의 주장과 진실이 나뉘어 보여요. 예) However, he died of asphyxia.',
    '③ 진짜 사망 원인이 빠졌어요. died of 뒤에 asphyxia(질식)를 쓰세요.',
    '④ 증거가 1개뿐이에요. 단서 수첩·활동 3을 보고 하나 더 쓰세요. 예) There were bruises on his neck and chest. / The doctor heard water in the lungs.',
    '④ “이상하다”는 느낌이 아니라 기록(부검 결과, 의사의 관찰)에서 나온 증거를 쓰세요.',
    '⑤ 왜 세상이 알아야 하는지 because 뒤에 이유를 문장으로 쓰세요. 예) because the truth is hidden.',
    '⑤ 기자에게 무엇을 해 달라는지 Please로 부탁하세요. 예) Please tell the world the truth.']],
  [2, '+', '언어 사용 +', [
    '지난 일을 과거시제(died, claimed, closed, heard)로 정확하게 썼어요.',
    'die of + 원인(died of asphyxia) 표현을 바르게 썼어요.',
    'claimed / according to 로 경찰이 한 말이라는 것을 분명히 했어요.',
    '단어장의 낱말(autopsy, bruises, lungs, evidence)을 알맞게 골라 썼어요.',
    '문장이 짧고 분명해서 한 번에 읽혀요.',
    '대문자와 마침표를 빠짐없이 지켰어요.']],
  [2, '-', '언어 사용 −', [
    '지난 일은 과거시제로 써요. die → died, say → said, claim → claimed, close → closed',
    'died of 다음에는 사망 원인(명사)이 와요. died of shock / died of asphyxia (died by, died for X)',
    '주어와 동사가 있는 완전한 문장으로 써요. 예) Bruises on his neck. (X) → There were bruises on his neck. (O)',
    '문장 첫 글자는 대문자, 끝에는 마침표(.)를 찍어요.',
    '철자를 단어장에서 확인하세요. 예) asphyxia, autopsy, bruises, lungs',
    '한글이 섞여 있어요. 모든 칸을 영어로 써 주세요.',
    '여러 개를 나열할 때는 and로 이어요. 예) on his neck and chest']],
];
const FB_END = ['이제 완성본으로 옮겨 쓰고 전송하세요.', '고친 뒤 다시 검토 요청하세요.'];
function fbAdd(val, sec, sign, text) {
  let L = (val || '').replace(/\s+$/, '').split('\n'); if (!L[0] && L.length === 1) L = [];
  if (!sec) { L.push(text); return L.join('\n') }
  if (!L.includes(FB_HEAD[1]) || !L.includes(FB_HEAD[2])) L = FB_TPL.split('\n').concat(L.filter(x => x.trim()));
  const h = L.indexOf(FB_HEAD[sec]); let end = L.findIndex((x, i) => i > h && (/^\d\.\s/.test(x) || (x.trim() && !/^[+-]/.test(x)))); if (end < 0) end = L.length;
  const empty = L.findIndex((x, i) => i > h && i < end && x.trim() === sign);
  if (empty >= 0) { L[empty] = sign + ' ' + text; return L.join('\n') }
  let at = -1; for (let i = h + 1; i < end; i++) if (L[i].startsWith(sign)) at = i;
  if (at < 0) at = sign === '+' ? h : end - 1;
  L.splice(at + 1, 0, sign + ' ' + text); return L.join('\n');
}
/* 자동 피드백 초안 (규칙 기반 · 교사가 확인·수정 후 보내기) */
function fbAuto(g) {
  const T = k => String(g[k] || '').trim(), low = k => T(k).toLowerCase(), all = ['f_s1', 'f_s2', 'f_s3', 'f_s4', 'f_s5'].map(T).join(' ');
  const P1 = [], M1 = [], P2 = [], M2 = [];
  const nums = ['①', '②', '③', '④', '⑤']; ['f_s1', 'f_s2', 'f_s3', 'f_s4', 'f_s5'].forEach((k, i) => { if (!T(k)) M1.push(`${nums[i]} 칸이 비어 있어요. 질문에 답하는 영어 문장을 1~2개 쓰세요.`) });
  // ① 사건
  if (T('f_s1')) { const date = /january\s*14|1\.\s*14|jan\.?\s*14/.test(low('f_s1')), wrongDate = /january\s*16/.test(low('f_s1')), place = /police office|seoul/.test(low('f_s1'));
    if (wrongDate) M1.push('① 1월 16일은 기사가 나온 날이에요. 학생이 숨진 날짜는 1문단 첫 문장(January 14)을 보세요.');
    else if (!date) M1.push('① 날짜가 빠졌어요. 기사 1문단 첫 문장에서 학생이 숨진 날짜를 찾아 On January 14, 1987, 처럼 쓰세요.');
    if (!place) M1.push('① 장소가 빠졌어요. 어디에서 숨졌는지 at a police office in Seoul 을 넣으세요.');
    if (date && place && !wrongDate) P1.push('① 날짜·장소·사건을 한 문장에 정확히 담았어요.') }
  // ② 경찰 주장
  if (T('f_s2')) { const rep = /claim|said|says|according to/.test(low('f_s2')), shock = /shock/.test(low('f_s2')), closed = /clos/.test(low('f_s2'));
    if (rep && shock) P1.push('② claimed / according to 로 경찰의 주장(died of shock)을 분명히 전했어요.'); else if (!shock) M1.push('② 경찰이 무엇이라고 주장했는지 The police claimed (that) he died of shock. 처럼 쓰세요.'); else M1.push('② 경찰이 한 말이라는 것을 claimed / said / According to the police 로 밝혀 주세요.');
    if (closed) P1.push('② 경찰이 그 뒤에 한 일(closed the case)까지 썼어요.'); else M1.push('② 경찰이 그 뒤에 한 일도 쓰세요. 예) They closed the case a few days later.') }
  // ③ 진실
  if (T('f_s3')) { const turn = /^(but|however)\b/i.test(T('f_s3')), asp = /asph|aspyx|suffocat|chok/.test(low('f_s3'));
    if (turn && asp) P1.push('③ However로 시작해 경찰의 주장과 진실(asphyxia)을 분명하게 나눴어요.');
    if (!turn) M1.push('③ But이나 However로 시작해야 경찰의 주장과 진실이 나뉘어 보여요. 예) However, he died of asphyxia.');
    if (!asp) M1.push('③ 진짜 사망 원인이 빠졌어요. died of 뒤에 asphyxia(질식)를 쓰세요.') }
  // ④ 증거
  if (T('f_s4')) { const t = low('f_s4'); const ev = [/bruise|neck|chest/.test(t), /water|lung/.test(t), /bleed|blood spot/.test(t), /autopsy|suggest|finding/.test(t), /floor|wet/.test(t), /breath|witness/.test(t)].filter(Boolean).length;
    if (ev >= 2) P1.push('④ 몸에 남은 흔적·의사의 관찰처럼 서로 다른 증거를 2개 이상 들었어요.'); else M1.push('④ 증거가 1개뿐이에요. 단서 수첩·활동 3을 보고 하나 더 쓰세요. 예) There were bruises on his neck and chest. / The doctor heard water in the lungs.') }
  // ⑤ 이유·부탁
  if (T('f_s5')) { const bc = /because/.test(low('f_s5')), pl = /please/.test(low('f_s5'));
    if (bc && pl) P1.push('⑤ because로 이유를 밝히고, Please로 기자에게 할 일을 분명히 부탁했어요.');
    if (!bc) M1.push('⑤ 왜 세상이 알아야 하는지 because 뒤에 이유를 문장으로 쓰세요. 예) because the truth is hidden.');
    if (!pl) M1.push('⑤ 기자에게 무엇을 해 달라는지 Please로 부탁하세요. 예) Please tell the world the truth.') }
  if (!M1.length && P1.length >= 4) P1.push('사건 → 주장 → 진실 → 증거 → 부탁 순서로 이어져서 처음 읽는 기자도 이해하기 쉬워요.');
  // 언어 사용
  if (all.trim()) {
    if (/[가-힣]/.test(all)) M2.push('한글이 섞여 있어요. 모든 칸을 영어로 써 주세요.');
    const tense = []; const L = ' ' + all.toLowerCase() + ' ';
    [['dies', 'died'], ['die of', 'died of'], ['says', 'said'], ['claims', 'claimed'], ['closes', 'closed'], ['hears', 'heard'], ['close the case', 'closed the case']].forEach(([w, r]) => { if (new RegExp('(?<!did not |didn.t |to |will |can |could )\\b' + w.replace(/ /g, '\\s+') + '\\b').test(L)) tense.push(`${w} → ${r}`) });
    if (/\b(he|she|they|police|student|doctor)\s+(die|say|claim|close|hear|take)\b/.test(L)) tense.push('동사 원형 → 과거형');
    if (tense.length) M2.push('지난 일은 과거시제로 써요. ' + [...new Set(tense)].slice(0, 4).join(', '));
    else if (/\b(died|claimed|closed|heard|said|took)\b/.test(L)) P2.push('지난 일을 과거시제(died, claimed, closed, heard)로 정확하게 썼어요.');
    if (/died\s+(by|for|from|with)\s+\w+/.test(L)) M2.push('사망 원인은 died of 로 써요. died by / died for (X) → died of asphyxia (O)');
    else if (/died\s+of\s+(shock|asphyxia)/.test(L)) P2.push('die of + 원인(died of asphyxia) 표현을 바르게 썼어요.');

    const noCap = sents.filter(x => /^[a-z]/.test(x)).length, noDot = ['f_s1', 'f_s2', 'f_s3', 'f_s4', 'f_s5'].filter(k => T(k) && !/[.!?]["”’)]?$/.test(T(k))).length;
    if (noCap || noDot) M2.push(`문장 첫 글자는 대문자, 끝에는 마침표(.)를 찍어요.${noCap ? ` (소문자로 시작한 문장 ${noCap}개)` : ''}${noDot ? ` (마침표 없는 칸 ${noDot}개)` : ''}`);

    const typo = [['asphixia', 'asphyxia'], ['asphyxa', 'asphyxia'], ['aspyxia', 'asphyxia'], ['autopcy', 'autopsy'], ['autopsi', 'autopsy'], ['bruses', 'bruises'], ['bruis ', 'bruise '], ['lung ', 'lungs '], ['polise', 'police'], ['univercity', 'university'], ['januray', 'January'], ['evidance', 'evidence'], ['shok ', 'shock ']].filter(([w]) => L.includes(w)).map(([w, r]) => `${w.trim()} → ${r.trim()}`);
    if (typo.length) M2.push('철자를 단어장에서 확인하세요. ' + typo.slice(0, 4).join(', '));
    const used = ['autopsy', 'bruises', 'lungs', 'evidence', 'asphyxia', 'according to', 'claimed'].filter(w => L.includes(w)); if (used.length >= 3 && !typo.length) P2.push(`단어장의 낱말(${used.slice(0, 4).join(', ')})을 알맞게 골라 썼어요.`);
  }

  out.push(M1.length || M2.length ? '− 표시된 부분을 고친 뒤 다시 검토 요청하세요.' : '이제 완성본으로 옮겨 쓰고 전송하세요.');

function fbClean(v) { // 빈 + / - 줄과 내용 없는 제목 지우기

}
let openBank = {}, PW = sessionStorage.getItem('m87pw') || '', DATA = { students: [], groups: [] }, tab = '', sortKey = 'no', drafts = {}, sentAt = {};

const n = v => +v || 999;

function drawGroups(G, S = []) {

    ${st === 'final' ? `<div class="final"><b style="font:700 11px var(--f);color:#a3261c">전송한 완성본 · ${wc}단어</b><br>${esc(g.final)}</div>` : g.final ? `<div class="final" style="opacity:.75"><b style="font:700 11px var(--f);color:#6b5a3a">작성 중인 완성본 · ${wc}단어</b><br>${esc(g.final)}</div>` : ''}

    <div class="row"><button class="btn auto" data-auto="${id}" type="button">⚡ 자동 피드백 초안</button><button class="btn" data-send="${id}">피드백 보내기</button><span class="sent">${g.t_fbAt ? '보낸 시각 ' + new Date(g.t_fbAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : ''}</span></div>` : `<p class="note" style="color:#6b5a3a;margin:8px 0 0">보낸 피드백: ${esc(g.t_feedback || '-')}</p>`}</article>` }).join('');

}
const COLS = [['no', '번호'], ['name', '이름'], ['team', '조'], ['a1', '활동 1 형광펜'], ['a2', '활동 2 T/F'], ['a3', '활동 3 증거'], ['up', '마지막 활동']];

function drawTable(S) {

$('#clr').onclick = () => { if (!tab) return; $('#cf').innerHTML = `<div class="confirm">${tab}반의 개인 활동과 조별 제보서 기록을 모두 지울까요? 되돌릴 수 없어요. <button class="btn" id="cy">지우기</button> <button class="btn" id="cn">취소</button></div>`; $('#cn').onclick = () => $('#cf').innerHTML = ''; $('#cy').onclick = async () => { await fetch('/api/m/clear', { method: 'POST', headers: H(), body: JSON.stringify({ cls: tab }) }); $('#cf').innerHTML = ''; DATA = await fetchAll(); draw() } };
