services:
  - type: web
    name: escape1987
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # 값은 Render 대시보드 > Environment 에서 직접 넣어요 (공개 저장소에 비밀번호·DB 주소를 두지 않기 위해)
      - key: TEACHER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
