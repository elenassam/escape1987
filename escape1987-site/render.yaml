services:
  - type: web
    name: escape1987
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TEACHER_PASSWORD
        value: "7891"
      - key: DATABASE_URL
        fromDatabase:
          name: escape1987-db
          property: connectionString
databases:
  - name: escape1987-db
    plan: free
